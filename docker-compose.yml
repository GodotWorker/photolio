services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.Backend
    restart: unless-stopped
    environment:
      PH_ADMINKEY: ${PH_ADMIN_KEY:?Set PH_ADMIN_KEY in .env}
      PH_STORAGE_LOCATION: /var/data
      PH_SERVER_ADDRESS: 0.0.0.0
      PH_SERVER_PORT: 80
      PH_STORAGE_MAX_BYTES: "100000000000"
      PH_SKIPPRECACHE: "false"
    volumes:
      - photolio_data:/var/data
    expose:
      - "80"
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.Webapp
      args:
        REACT_APP_API_ROOT_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PHOTOLIO_PORT:-8080}:80"
volumes:
  photolio_data:
    name: photolio_data
